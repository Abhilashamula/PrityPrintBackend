services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pingprint
      POSTGRES_USER: pingprint
      POSTGRES_PASSWORD: pingprint_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pingprint-postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pingprint -d pingprint"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/pingprint
      DATABASE_USERNAME: pingprint
      DATABASE_PASSWORD: pingprint_dev_only
      JWT_SECRET: local-development-secret-change-this-value-123456789
      FRONTEND_URL: http://localhost:5173,http://localhost:5174
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      EPSON_API_KEY: ${EPSON_API_KEY:-}
      EPSON_CLIENT_ID: ${EPSON_CLIENT_ID:-}
      EPSON_CLIENT_SECRET: ${EPSON_CLIENT_SECRET:-}
      EPSON_REDIRECT_URI: ${EPSON_REDIRECT_URI:-http://localhost:8080/api/epson/oauth/callback}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      REQUIRE_EMAIL_VERIFICATION: "false"
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pingprint-postgres:
