spring:
  application:
    name: ping-print-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pingprint}
    username: ${DATABASE_USERNAME:pingprint}
    password: ${DATABASE_PASSWORD:pingprint_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: 20MB

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173,http://localhost:5174}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  email-verification-hours: ${EMAIL_VERIFICATION_HOURS:24}
  require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:false}
